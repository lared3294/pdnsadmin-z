[server]
# HTTP local detrás de Nginx; para TLS directo usar, por ejemplo, 0.0.0.0:8443.
bind = 127.0.0.1:5000
workers = 3

[tls]
# False si HTTPS termina en Nginx. True para servir HTTPS desde Gunicorn.
enabled = False
# Las rutas relativas se resuelven respecto a este archivo INI.
certfile = cert.pem
keyfile = privkey.pem

[pdns]
url_internal = http://127.0.0.1:8081/api/v1/servers/internal
key_internal = CHANGE_ME
url_external = http://127.0.0.1:8081/api/v1/servers/external
key_external = CHANGE_ME
default_zone_kind = Master
default_nameservers =

[flask]
secret_key =
session_secure = True
trust_proxy = False
proxy_hops = 1
session_file_dir = /tmp/flask_sessions

[oidc]
enabled = False
issuer =
client_id =
client_secret =
admin_role = AdminDNSUsers
user_role = DNSUsers
groups_claim = Grupos
verify_ssl = True
redirect_uri =
